name: Qualified glider relay and physical relocation feasibility
on:
  workflow_dispatch:
jobs:
  relay-native-life:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native Life relay, refined mouth, and truly relocated lyric-source singer
        run: |
          python -m unittest tests.test_physical_glider_relay tests.test_refined_singer_candidate tests.test_relocated_singer_anchor -v
      - name: Export physically moved initial universe
        run: |
          python -m life.export_relocated_singer_anchor --out patterns/relocated_singer_word_anchor.rle --report output/relocated_singer_word_anchor.json
      - name: Render actual below-bubble controller and narrower physical lip stages
        run: |
          python -m pip install 'Pillow>=10,<13'
          python preview/make_refined_singer_candidate.py
          python preview/render_relocated_controller_candidate.py
      - name: Archive reproducible source for further route engineering
        run: tar -czf conway_source.tar.gz life preview tests data research .github
      - uses: actions/upload-artifact@v4
        with:
          name: native-below-bubble-singer-and-relay-qualification
          path: |
            conway_source.tar.gz
            patterns/relocated_singer_word_anchor.rle
            output/relocated_singer_word_anchor.json
            preview/refined_singer_qualified_candidate.png
            preview/refined_singer_open_closeup.png
            preview/relocated_controller_real_life.png
            preview/relocated_controller_word_on.png
          retention-days: 14
