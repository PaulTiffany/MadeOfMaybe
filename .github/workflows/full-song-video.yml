name: Render full-song Conway karaoke video
on:
  workflow_dispatch:
jobs:
  optical-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video tools
        run: |
          python -m pip install 'Pillow>=10,<13'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          ffmpeg -version
      - name: Check exact native Life block occupancy against B3/S23
        run: python -m unittest tests.test_life_cell_sampler -v
      - name: Render all 66 sung lines from original glider programs
        run: |
          mkdir -p output/video
          python preview/render_full_song_karaoke.py \
            --out output/video/made_of_maybe_conway_karaoke_silent.mp4 \
            --thumbnail output/video/native_life_karaoke_thumbnail.png \
            --metadata output/video/optical_video_provenance.json
          ffprobe -v error -show_entries format=duration,size:stream=nb_frames \
            -of json output/video/made_of_maybe_conway_karaoke_silent.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: MadeOfMaybe-full-song-conway-karaoke-video
          path: output/video/
          retention-days: 30
