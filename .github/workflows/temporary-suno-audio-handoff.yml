name: One-time original Suno audio handoff
on:
  push:
    branches: [research/glider-driven-singer-pilot]
    paths: ['.github/workflows/temporary-suno-audio-handoff.yml']
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the owner's authorized time-limited original Suno download
        env:
          AUDIO_URL: 'https://suno-data-uploads.s3.amazonaws.com/studio/uploads/53610991-7381-4749-96e1-79b8e3b1c28b_paid_wm.mp3?response-content-type=audio%2Fmpeg&response-content-disposition=attachment%3B%20filename%2A%3DUTF-8%27%27MADE%2520OF%2520MAYBE.mp3&AWSAccessKeyId=AKIA2V4GXGDKLZ43MUG7&Signature=q42%2FKI%2BOcMfOJ73XGUvqReJlO%2BY%3D&Expires=1794340374'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$AUDIO_URL" -o original_made_of_maybe.mp3
          test "$(wc -c < original_made_of_maybe.mp3)" -gt 1000000
          ffprobe -v error -show_entries format=duration,size -of json original_made_of_maybe.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: original-owner-suno-track-transient-transfer
          path: original_made_of_maybe.mp3
          retention-days: 1
