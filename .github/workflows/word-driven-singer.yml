name: Word-driven three-state mouth and causal first-line film
on:
  push:
    branches: [main, research/glider-driven-singer-pilot]
  pull_request:
  workflow_dispatch:
jobs:
  word-sourced-singer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optical-preview renderer
        run: python -m pip install 'Pillow>=10,<13'
      - name: Ensure FFmpeg and FFprobe are available on runner
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Qualify native-lyric score and physical-causal camera
        run: python -m unittest tests.test_word_driven_expression tests.test_phrase_mouth_gate tests.test_causal_firstline_camera tests.test_cascaded_lyric_splitter tests.test_causal_layout_limit -v
      - name: Export all 403 source-linked word cue intentions
        run: |
          python -m life.export_word_driven_expression \
            --alignment data/made_of_maybe_suno_alignment.json \
            --out output/full_song_three_state_intent.json
      - name: Export source-linked phrase start / medium-open cycle / rest gate
        run: |
          python -m life.export_phrase_mouth_gate \
            --alignment data/made_of_maybe_suno_alignment.json \
            --out output/full_song_phrase_mouth_gate.json
      - name: Certify single-source geometry constraints of sparse lyric world
        run: |
          python - <<'PYWORK'
          import json
          from pathlib import Path
          from life.causal_layout_limit import report
          out=Path('output/sparse_lyric_light_cone_audit.json')
          out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(report(),indent=2)+'\n')
          PYWORK
      - name: Export exact B3/S23 four-output cascaded splitter
        run: python -m life.export_cascaded_splitter
      - name: Render first-line video from actual shared glider and real mouth element
        run: |
          python preview/render_causal_firstline_singer.py \
            --out preview/causal_firstline_singer.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of json preview/causal_firstline_singer.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: made-of-maybe-word-sourced-causal-firstline-singer
          path: |
            preview/causal_firstline_singer.mp4
            preview/causal_firstline_character_frame.png
            preview/causal_firstline_singer_metadata.json
            output/full_song_three_state_intent.json
            output/full_song_phrase_mouth_gate.json
            output/one_to_four_word_glider_splitter.json
            output/sparse_lyric_light_cone_audit.json
            patterns/one_to_four_word_glider_splitter.rle
          retention-days: 30
