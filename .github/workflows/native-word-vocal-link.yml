name: Native word-turner glider physically gates Suno vocal lip
on:
  workflow_dispatch:
jobs:
  physical-word-vocal-link:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Native 4-way W/V source-ablation test
        run: python -m unittest tests.test_native_word_vocal_link -v
      - name: Build real 8867-cell initial Life universe and Golly seed
        run: python -m life.native_word_vocal_link --out output/word_vocal_link
      - name: Compile exact B3/S23 simulator and independence auditors
        run: |
          g++ -O3 -std=c++17 research/staggered_mesh_native.cpp -o /tmp/native_audit
          g++ -O3 -std=c++17 research/one_world_native_frames.cpp -o /tmp/native_frames
      - name: Check each g0..g3840 world generation against 5 components
        run: |
          /tmp/native_audit output/word_vocal_link/real_W_marker_V_mouth_parts.tsv 3840 \
            output/word_vocal_link/final.tsv 3840 output/word_vocal_link/forming.tsv
      - name: Generate all 481 native 192g/s film frames
        run: |
          /tmp/native_frames output/word_vocal_link/real_W_marker_V_mouth_seed.tsv \
            output/word_vocal_link/full_world.bin 3840 8
      - name: Verify actual WE, linked native lip, original Suno stem and jaw
        run: |
          python -m tests.verify_native_word_vocal_link \
            output/word_vocal_link/full_world.bin output/word_vocal_link/qualification.json
      - name: Film the unmodified world with continuous camera
        run: |
          python -m pip install 'Pillow>=10,<13'
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m preview.render_native_word_vocal_link \
            --frames output/word_vocal_link/full_world.bin \
            --out output/word_vocal_link/physical_word_vocal_silent.mp4
          ffprobe -v error -show_entries format=duration:stream=nb_frames \
            -of json output/word_vocal_link/physical_word_vocal_silent.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: suno-word-LWSS-physically-linked-to-vocal-mouth
          path: |
            output/word_vocal_link/*.rle
            output/word_vocal_link/*.json
            output/word_vocal_link/*.mp4
          retention-days: 30
