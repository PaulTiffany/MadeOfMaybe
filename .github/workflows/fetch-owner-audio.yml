name: Fetch owner-published original Made Of Maybe audio for local edit
on:
  push:
    branches: [research/glider-driven-singer-pilot]
    paths: ['.github/workflows/fetch-owner-audio.yml']
  workflow_dispatch:
jobs:
  get-original-song:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download public original Suno song without spending export credits
        run: |
          curl --fail --location --retry 2 --silent --show-error             'https://cdn1.suno.ai/53610991-7381-4749-96e1-79b8e3b1c28b.mp3'             -o original_made_of_maybe.mp3
          test "$(wc -c < original_made_of_maybe.mp3)" -gt 1000000
      - name: Inspect duration and decoding
        run: |
          ffprobe -v error -show_entries format=duration,size             -of json original_made_of_maybe.mp3
          ffmpeg -v error -i original_made_of_maybe.mp3             -f null - </dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: owner-original-made-of-maybe-audio
          path: original_made_of_maybe.mp3
          retention-days: 1
