name: Made of Maybe physical 403-word one-world LWSS film (bubble-free)
on:
  workflow_dispatch:
  push:
    branches: [research/glider-driven-singer-pilot]
    paths:
      - 'preview/render_native_403_lwss_world.py'
      - 'life/full_song_lwss_readhead.py'
      - '.github/workflows/native-403-real-cell-film.yml'
jobs:
  physical-full-song-workprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install encoder and native B3/S23 camera
        run: |
          python -m pip install 'Pillow>=10,<13'
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y ffmpeg; fi
      - name: Qualify native 401-word LWSS bank with source isolation
        run: python -m unittest tests.test_full_song_lwss_readhead -v
      - name: Build exact singer with original two turned words, no bubble
        run: |
          python - <<'PY'
          from life.two_line_native_singer import export_winner
          d=export_winner(900,144,'output/native_403_film')
          assert d['physical_bubble_cells_g0']==0
          PY
      - name: Independently compute original real singer to stable g4096
        run: |
          g++ -O3 -std=c++17 research/one_world_native_frames.cpp -o /tmp/real_singer
          /tmp/real_singer output/native_403_film/winning_g0.tsv \
            output/native_403_film/native_original_singer_513_frames.bin 4096 8
      - name: Film all 3 minutes 58.875 seconds of genuine Game of Life cells
        run: |
          python preview/render_native_403_lwss_world.py \
            --singer output/native_403_film/native_original_singer_513_frames.bin \
            --out output/native_403_film/MadeOfMaybe_full_native_LWSS_silent.mp4
      - name: Check original song audio can be acquired WITHOUT Suno credit expense
        continue-on-error: true
        run: |
          curl -fL --retry 1 --max-time 45 \
            'https://cdn1.suno.ai/53610991-7381-4749-96e1-79b8e3b1c28b.mp3' \
            -o output/native_403_film/public_suno_master.mp3
          ffprobe -v error -select_streams a:0 \
             -show_entries stream=codec_name -of csv=p=0 \
             output/native_403_film/public_suno_master.mp3 | grep -q mp3
          ffmpeg -hide_banner -loglevel error -y \
            -i output/native_403_film/MadeOfMaybe_full_native_LWSS_silent.mp4 \
            -i output/native_403_film/public_suno_master.mp3 \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac \
            -b:a 192k -shortest \
            output/native_403_film/MadeOfMaybe_full_native_LWSS_with_original_audio.mp4
          rm -f output/native_403_film/public_suno_master.mp3
      - name: Inspect length and frame rate
        run: |
          ffprobe -v error -select_streams v:0 -show_entries \
            stream=width,height,nb_frames,avg_frame_rate,duration \
            -of json output/native_403_film/MadeOfMaybe_full_native_LWSS_silent.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: made-of-maybe-native-403-real-cell-bubbleless-workprint
          path: |
            output/native_403_film/*.json
            output/native_403_film/*.mp4
            output/native_403_film/winning_g0.rle
          retention-days: 30
